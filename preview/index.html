<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLACE #1 – Cafe Management System</title>
<style>
:root{--bgx:radial-gradient(1100px 520px at 85% -10%,#ee3a49 0,transparent 62%),linear-gradient(180deg,#b3111f,#8a0c17);--bg:#1b0a0d;--card:#17110f;--ink:#fff4f0;--mut:#c9b3ad;--line:#2f2220;--cream:#261a18;--bb:#ff3b4a;--onb:#fff;--sage:#9b2f3a;--ok:#6ee7a0;--warn:#ffc857;--bad:#ff8a8a;--acc:#ff5a68;--h:#fff;--h2:#ffe1e3}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bgx);background-attachment:fixed;color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.shell{display:flex;min-height:100vh}
.side{display:none;flex-direction:column;gap:4px;width:230px;padding:20px 14px;background:var(--card);border-right:1px solid var(--line)}
.logo{font-weight:700;font-size:17px;color:var(--acc);padding:4px 10px 16px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left;width:100%}
.nb.on{background:var(--bb);color:var(--onb)}
.bn{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bn .nb{flex-direction:column;gap:0;padding:8px 2px;font-size:11px;justify-content:center;align-items:center;border-radius:0}
.bn .nb span{font-size:20px}
main{flex:1;min-width:0;padding:16px 14px 90px;max-width:1100px}
.banner{background:var(--cream);border:1px dashed var(--sage);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-bottom:14px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.k{color:var(--mut);font-size:12px}.v{font-size:19px;font-weight:700;margin-top:2px;word-break:break-word}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--cream);color:var(--mut)}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;background:var(--sage);border-radius:6px 6px 0 0;min-height:3px}
.bar.t i{background:var(--bb)}
.two{display:grid;gap:12px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.mi:disabled{opacity:.45;cursor:not-allowed}.mi .e{font-size:26px}
.btn{background:var(--bb);color:var(--onb);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.sec{background:var(--cream);color:var(--ink)}.btn.sm{padding:6px 12px;min-height:0;font-size:13px}
.btn:disabled{opacity:.5}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--bb);color:var(--onb);border-color:var(--bb)}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.meter{height:6px;background:var(--cream);border-radius:9px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--sage)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.rc{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:360px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:10}
@media(min-width:900px){.side{display:flex}.bn{display:none}main{padding:24px 28px 40px}.grid{grid-template-columns:repeat(5,1fr)}.two{grid-template-columns:1.6fr 1fr}.menu{grid-template-columns:repeat(3,1fr)}.toast{bottom:24px}}
.card{box-shadow:0 10px 30px rgba(0,0,0,.28)}
.btn{box-shadow:0 6px 18px rgba(255,59,74,.35);transition:transform .12s}.btn:active{transform:scale(.97)}.btn.sec{box-shadow:none}
.mi{transition:transform .15s,border-color .15s}.mi:hover:not(:disabled){transform:translateY(-3px);border-color:var(--bb)}
.side,.bn{background:#0b0807;border-color:#2a1d1b}.side .nb,.bn .nb{color:#f6e9e6}.side .nb.on,.bn .nb.on{background:var(--bb);color:var(--onb)}
.lgbox{background:#000;border-radius:14px;padding:6px;display:flex;justify-content:center}.lgbox img{display:block;max-width:100%;height:auto}
.brand{padding:0 0 14px}.mtop{margin-bottom:12px}.mtop .lgbox img{height:46px;width:auto}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px;border-radius:18px;margin-bottom:12px;background:linear-gradient(135deg,#000 0%,#2b070c 55%,#7d0f1b 100%);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 34px rgba(0,0,0,.35);color:#fff}
.hk{font-size:12px;color:#ffd5d9}.hn{font-size:24px;font-weight:800;letter-spacing:.5px;line-height:1.15}
.hp{text-align:right}.hp b{display:block;font-size:32px;color:#ff5a68;line-height:1}.hp span{font-size:11px;color:#ffd5d9}
main>h1,main>h2{color:var(--h)}main>p.k{color:var(--h2)}
.meter i{background:linear-gradient(90deg,var(--bb),#ff8a94)}
.bar i{background:linear-gradient(180deg,var(--sage),#5a1b22)}.bar.t i{background:linear-gradient(180deg,#ff6b78,var(--bb))}
@media(min-width:900px){.mtop{display:none}}
</style></head>
<body><div id="app"></div>
<script>
const fmt=n=>(n<0?'-Rp':'Rp')+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const ING={kopi:{n:'Biji Kopi',u:'g',s:5000,min:1000,c:180000},es:{n:'Es Batu',u:'g',s:20000,min:3000,c:5000},gelas:{n:'Gelas Plastik',u:'pcs',s:300,min:50,c:700000},susu:{n:'Susu',u:'ml',s:10000,min:2000,c:18000},gula:{n:'Gula Aren',u:'ml',s:400,min:500,c:30000},gp:{n:'Gula Pasir',u:'g',s:3000,min:500,c:16000},coklat:{n:'Cokelat Bubuk',u:'g',s:1500,min:300,c:120000},yakult:{n:'Yakult',u:'pcs',s:30,min:20,c:2500000},th:{n:'Teh Hitam',u:'g',s:800,min:200,c:60000},tg:{n:'Teh Hijau',u:'g',s:600,min:200,c:150000},tt:{n:'Thai Tea Bubuk',u:'g',s:700,min:200,c:150000}};
[['peach','Peach'],['berry','Berry'],['orange','Orange'],['apple','Apple'],['lychee','Lychee'],['pandan','Pandan'],['kelapa','Kelapa'],['pisang','Pisang'],['vanilla','Vanilla'],['butterscotch','Butterscotch'],['mangga','Mangga'],['lemon','Lemon'],['strawberry','Strawberry']].forEach(([k,n])=>ING['s_'+k]={n:'Sirup '+n,u:'ml',s:k=='butterscotch'?150:1000,min:200,c:80000});
let _i=0;const M=(n,cat,p,e,r)=>({id:++_i,n,cat,p,e,r});
const cano=(f,e,k)=>M(f+' Cano','Black Series',13000,e,{kopi:18,['s_'+k]:20,es:150,gelas:1});
const kp=(n,k,e)=>M(n,'Kopi',13000,e,{kopi:18,susu:120,['s_'+k]:20,es:150,gelas:1});
const yk=(n,k,e)=>M(n,'Yakult Series',15000,e,{yakult:2,['s_'+k]:20,es:150,gelas:1});
const MENU=[M('Americano','Black Series',13000,'☕',{kopi:18,es:150,gelas:1}),cano('Peach','🍑','peach'),cano('Berry','🫐','berry'),cano('Orange','🍊','orange'),cano('Apple','🍎','apple'),cano('Lychee','🍒','lychee'),
M('Kopi Gula Aren','Kopi',13000,'🧋',{kopi:18,susu:120,gula:25,es:150,gelas:1}),M('Kopi Susu','Kopi',13000,'🥛',{kopi:18,susu:150,gp:10,es:150,gelas:1}),kp('Kopi Pandan','pandan','🌿'),kp('Kopi Kelapa','kelapa','🥥'),kp('Kopi Pisang','pisang','🍌'),kp('Kopi Vanilla','vanilla','🍦'),M('Moccacino','Kopi',13000,'🍫',{kopi:18,coklat:15,susu:120,es:150,gelas:1}),M('Butterscotch','Kopi',15000,'🍮',{kopi:18,susu:120,s_butterscotch:25,es:150,gelas:1}),
yk('Manggo Yakult','mangga','🥭'),yk('Lemon Yakult','lemon','🍋'),yk('Strawberry Yakult','strawberry','🍓'),
M('Chocolate','Non-Coffee',13000,'🍫',{coklat:30,susu:150,es:100,gelas:1}),M('Milk Tea','Non-Coffee',13000,'🧋',{th:6,susu:120,gp:10,es:150,gelas:1}),M('Green Tea','Non-Coffee',13000,'🍵',{tg:6,gp:15,es:150,gelas:1}),M('Thai Tea','Non-Coffee',13000,'🍹',{tt:8,susu:100,gp:10,es:150,gelas:1}),M('Teh Tarik','Non-Coffee',13000,'🫖',{th:6,susu:120,gp:8,es:150,gelas:1}),M('Lemon Tea','Non-Coffee',13000,'🍋',{th:5,s_lemon:25,gp:5,es:150,gelas:1}),M('Vanilla Haze','Non-Coffee',13000,'🍦',{s_vanilla:25,susu:120,es:150,gelas:1})];
const TAX=1000, menu=id=>MENU.find(m=>m.id===Number(id));
const hpp=m=>Math.round(Object.entries(m.r).reduce((s,[k,q])=>s+q*ING[k].c,0)/1000);
const canMake=(m,n)=>Object.entries(m.r).every(([k,q])=>ING[k].s>=q*n);
const txs=[];let seq=0;
function mk(items,method,type,ago,demo){const sub=items.reduce((s,[id,n])=>s+menu(id).p*n,0),tax=Math.round(sub*TAX/10000);
 const t={lines:items.map(([id,n])=>({n:menu(id).n,q:n,p:menu(id).p})),no:'INV-'+String(++seq).padStart(4,'0'),at:new Date(Date.now()-ago*60000),items,sub,tax,total:sub+tax,hpp:items.reduce((s,[id,n])=>s+hpp(menu(id))*n,0),method,type,status:'paid',demo};txs.unshift(t);return t}
mk([[7,2],[15,1]],'QRIS','Dine In',50,true);mk([[1,1]],'Tunai','Take Away',40,true);mk([[8,1],[2,1]],'Tunai','Dine In',30,true);mk([[19,2]],'E-wallet','Take Away',20,true);mk([[7,3],[18,2]],'QRIS','Delivery',10,true);
const PREV=[410000,520000,380000,610000,570000,690000];
let tab='home',cat='Semua',q='',cart={},type='Dine In',method='Tunai',cash='',toast='',rc=null;
const day=d=>d.toLocaleDateString('en-CA',{timeZone:'Asia/Makassar'});
const isToday=t=>t.demo||day(t.at)===day(new Date());
const net=t=>t.status==='paid'?t.sub:0;
function say(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const cartRows=()=>Object.entries(cart).filter(([,n])=>n>0).map(([id,n])=>[+id,n]);
const totals=()=>{const sub=cartRows().reduce((s,[id,n])=>s+menu(id).p*n,0),tax=Math.round(sub*TAX/10000);return{sub,tax,total:sub+tax}};
function add(id,d){const n=(cart[id]||0)+d;if(d>0&&!canMake(menu(id),n))return say('Stok bahan tidak cukup');cart[id]=Math.max(0,n);R()}
function pay(){const T=totals();if(!T.total)return say('Keranjang kosong');const paid=method==='Tunai'?(+cash||0):T.total;
 if(paid<T.total)return say('Pembayaran kurang '+fmt(T.total-paid));
 const items=cartRows();items.forEach(([id,n])=>Object.entries(menu(id).r).forEach(([k,qq])=>ING[k].s-=qq*n));
 const t=mk(items,method,type,0,false);rc={t,paid,change:paid-T.total};cart={};cash='';R()}
function refund(no){const t=txs.find(x=>x.no===no);if(!confirm('Refund '+no+'? Stok bahan dikembalikan.'))return;
 t.status='refunded';if(!t.demo)t.items.forEach(([id,n])=>Object.entries(menu(id).r).forEach(([k,qq])=>ING[k].s+=qq*n));say(no+' direfund');R()}
const st=i=>i.s<=0?['Habis','bad']:i.s<=i.min?['Menipis','warn']:['Aman','ok'];
function home(){const td=txs.filter(isToday),paid=td.filter(t=>t.status==='paid'),om=paid.reduce((s,t)=>s+net(t),0),h=paid.reduce((s,t)=>s+t.hpp,0);
 const vals=[...PREV,om],mx=Math.max(...vals,1);
 const lbl=vals.map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5);return d.toLocaleDateString('id-ID',{timeZone:'Asia/Makassar',weekday:'short'})});
 const cnt={};paid.forEach(t=>t.items.forEach(([id,n])=>cnt[id]=(cnt[id]||0)+n));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
 const low=Object.values(ING).filter(i=>!i.del&&st(i)[1]!=='ok');
 const c=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
 return`<h1>Dashboard</h1><div class="grid">${c('Omzet hari ini',fmt(om))}${c('Transaksi',paid.length)}${c('Rata-rata',fmt(paid.length?Math.round(om/paid.length):0))}${c('Estimasi HPP',fmt(h))}${c('Laba kotor',fmt(om-h))}</div>
 <div class="two" style="margin-top:12px"><div class="card"><h2>Omzet 7 hari terakhir</h2><div class="chart">${vals.map((v,i)=>`<div class="bar ${i==6?'t':''}" title="${lbl[i]}: ${fmt(v)}"><i style="height:${Math.round(v/mx*100)}%"></i>${lbl[i]}</div>`).join('')}</div></div>
 <div style="display:grid;gap:12px"><div class="card"><h2>Menu terlaris</h2>${top.map(([id,n])=>`<div class="row"><span>${menu(id).e} ${menu(id).n}</span><b>${n}</b></div>`).join('')||'<div class="k">Belum ada penjualan</div>'}</div>
 <div class="card"><h2>Perlu restock</h2>${low.map(i=>`<div class="row"><span>${i.n}</span><span class="chip ${st(i)[1]}">${st(i)[0]}</span></div>`).join('')||'<div class="k">Semua aman</div>'}</div></div></div>
 <p class="k">Laba adalah estimasi operasional, bukan laporan laba rugi akuntansi atau perhitungan pajak final.</p>`}
function pos(){const cats=['Semua',...new Set(MENU.map(m=>m.cat))],T=totals(),rows=cartRows();
 const list=MENU.filter(m=>!m.del&&(cat=='Semua'||m.cat==cat)&&m.n.toLowerCase().includes(q.toLowerCase()));
 return`<h1>Kasir</h1><div class="two"><div><input placeholder="Cari menu…" value="${q}" oninput="q=this.value;R(1)" id="s"><div class="pills" style="margin-top:8px">${cats.map(c=>`<button class="pill ${c==cat?'on':''}" onclick="cat='${c}';R()">${c}</button>`).join('')}</div>
 <div class="menu">${list.map(m=>{const ok=canMake(m,1);return`<button class="mi" ${ok?'':'disabled'} onclick="add(${m.id},1)"><div class="e">${m.e}</div><b>${m.n}</b><div class="k">${m.cat}</div><div>${fmt(m.p)}</div>${ok?'':'<span class="chip bad">Habis</span>'}</button>`}).join('')}</div></div>
 <div class="card" style="align-self:start"><h2>Keranjang</h2>${rows.map(([id,n])=>`<div class="row"><span>${menu(id).n}<div class="k">${fmt(menu(id).p)}</div></span><span class="qty"><button onclick="add(${id},-1)">−</button><b>${n}</b><button onclick="add(${id},1)">+</button></span></div>`).join('')||'<div class="k">Belum ada item</div>'}
 <div class="row"><span class="k">Subtotal</span><span>${fmt(T.sub)}</span></div><div class="row"><span class="k">Pajak 10%</span><span>${fmt(T.tax)}</span></div><div class="row"><b>Total</b><b>${fmt(T.total)}</b></div>
 <div style="display:grid;gap:8px;margin-top:8px"><select onchange="type=this.value">${['Dine In','Take Away','Delivery'].map(o=>`<option ${o==type?'selected':''}>${o}</option>`).join('')}</select>
 <select onchange="method=this.value;R()">${['Tunai','QRIS','Transfer','E-wallet','Kartu'].map(o=>`<option ${o==method?'selected':''}>${o}</option>`).join('')}</select>
 ${method=='Tunai'?`<input id="cash" inputmode="numeric" placeholder="Uang diterima (Rp)" value="${cash}" oninput="cash=this.value.replace(/\\D/g,'');this.value=cash">`:''}
 <button class="btn" onclick="pay()">Bayar ${fmt(T.total)}</button></div></div></div>`}
function hist(){return`<h1>Transaksi</h1><div class="card">${txs.map(t=>`<div class="row"><span><b>${t.no}</b> ${t.demo?'<span class="chip">DEMO</span>':''}<div class="k">${t.at.toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit'})} · ${t.type} · ${t.method}</div></span><span style="text-align:right"><b>${fmt(t.total)}</b><div><span class="chip ${t.status=='paid'?'ok':'bad'}">${t.status=='paid'?'Paid':'Refunded'}</span> ${t.status=='paid'?`<button class="btn sec sm" onclick="refund('${t.no}')">Refund</button>`:''}</div></span></div>`).join('')}</div>`}
function stock(){return`<h1>Stok bahan</h1><div class="card">${Object.values(ING).map(i=>{const [l,c]=st(i);return`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>${i.n}</b><span class="chip ${c}">${l}</span></div><div class="k">${Math.max(0,i.s).toLocaleString('id-ID')} ${i.u} · min ${i.min.toLocaleString('id-ID')}</div><div class="meter"><i style="width:${Math.min(100,Math.max(0,i.s/(i.min*4)*100))}%"></i></div></div>`}).join('')}</div><p class="k">Stok berkurang otomatis saat kasir menjual menu sesuai resep. HPP menggunakan moving weighted average.</p>`}
function receipt(){const{t,paid,change}=rc;return`<div class="ov"><div class="rc"><div style="text-align:center"><b>${cfg.name}</b><br>${cfg.tag}<br>${t.no}<br>${t.at.toLocaleString('id-ID',{timeZone:'Asia/Makassar'})}</div><hr>
${t.items.map(([id,n])=>`<div style="display:flex;justify-content:space-between"><span>${n}x ${menu(id).n}</span><span>${fmt(menu(id).p*n)}</span></div>`).join('')}<hr>
<div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${fmt(t.sub)}</span></div><div style="display:flex;justify-content:space-between"><span>Pajak 10%</span><span>${fmt(t.tax)}</span></div><div style="display:flex;justify-content:space-between"><b>Total</b><b>${fmt(t.total)}</b></div>
<div style="display:flex;justify-content:space-between"><span>${t.method}</span><span>${fmt(paid)}</span></div><div style="display:flex;justify-content:space-between"><span>Kembali</span><span>${fmt(change)}</span></div>
<p style="text-align:center">Kasir: Demo Kasir</p><button class="btn" style="width:100%" onclick="rc=null;R()">Selesai</button></div></div>`}
let dt=null,fm=null,hq='';const moves=[];
const ings=()=>Object.entries(ING).filter(([,i])=>!i.del);
function openForm(title,fields,f,save){fm={title,fields,f,save};R()}
function formSave(){fm.fields.forEach(x=>{const e=document.getElementById('f_'+x.k);fm.f[x.k]=e?e.value:''});const err=fm.save(fm.f);if(err){say(err);return}fm=null;R()}
function formView(){return`<div class="ov"><div class="rc" style="font-family:inherit;max-height:90vh;overflow:auto"><h2>${fm.title}</h2>${fm.fields.map(x=>`<label class="k">${x.l}</label>${x.t=='select'?`<select id="f_${x.k}">${x.o.map(o=>`<option ${o==fm.f[x.k]?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="f_${x.k}" ${x.t=='number'?'inputmode="decimal"':''} value="${fm.f[x.k]??''}">`}`).join('<div style="height:8px"></div>')}<div style="display:flex;gap:8px;margin-top:14px"><button class="btn sec" style="flex:1" onclick="fm=null;R()">Batal</button><button class="btn" style="flex:1" onclick="formSave()">Simpan</button></div></div></div>`}
function restock(k){const i=ING[k];openForm('Tambah stok: '+i.n,[{k:'q',l:'Jumlah masuk ('+i.u+')',t:'number'},{k:'p',l:'Total harga beli (Rp)',t:'number'}],{q:'',p:''},f=>{const qn=Number(f.q),p=Number(f.p||0);if(!(qn>0)||!Number.isInteger(qn))return'Jumlah harus bilangan bulat > 0';if(!Number.isInteger(p)||p<0)return'Harga harus bilangan bulat Rupiah';const old=Math.max(0,i.s),inC=Math.round(p*1000/qn);i.c=Math.round((old*i.c+qn*inC)/(old+qn));i.s+=qn;moves.unshift({at:new Date(),k,q:qn,p,why:'Pembelian'});say('Stok '+i.n+' bertambah '+qn+' '+i.u);return null})}
function ingForm(k){const i=k?ING[k]:null;openForm(i?'Edit bahan':'Bahan baru',[{k:'n',l:'Nama bahan',t:'text'},{k:'u',l:'Satuan (g, ml, pcs)',t:'text'},{k:'s',l:i?'Stok saat ini (jika diubah = penyesuaian)':'Stok awal',t:'number'},{k:'min',l:'Stok minimum',t:'number'},{k:'c',l:'Harga per satuan (Rp)',t:'number'}],i?{n:i.n,u:i.u,s:i.s,min:i.min,c:i.c/1000}:{n:'',u:'',s:0,min:0,c:0},f=>{const s=Number(f.s),mn=Number(f.min),c=Number(f.c);if(!f.n.trim()||!f.u.trim())return'Nama dan satuan wajib diisi';if(!Number.isInteger(s)||!Number.isInteger(mn)||s<0||mn<0||!(c>=0))return'Stok harus bilangan bulat ≥ 0 dan harga ≥ 0';const d={n:f.n.trim(),u:f.u.trim(),s,min:mn,c:Math.round(c*1000)};if(i){if(s!==i.s)moves.unshift({at:new Date(),k,q:s-i.s,p:0,why:'Penyesuaian'});Object.assign(i,d)}else{const nk='i'+Date.now();ING[nk]=d;if(s>0)moves.unshift({at:new Date(),k:nk,q:s,p:0,why:'Stok awal'})}return null})}
function delIng(k){const u=MENU.filter(m=>!m.del&&m.r[k]);if(u.length)return say('Dipakai di resep: '+u.map(m=>m.n).join(', '));if(!confirm('Hapus bahan '+ING[k].n+'?'))return;ING[k].del=true;R()}
function menuForm(id){const m=id?menu(id):null,ik=ings(),f={n:m?m.n:'',e:m?m.e:'🍽️',cat:m?m.cat:'Kopi',p:m?m.p:''};ik.forEach(([k])=>f['r_'+k]=(m&&m.r[k])||0);
 openForm(m?'Edit menu':'Menu baru',[{k:'n',l:'Nama menu',t:'text'},{k:'e',l:'Emoji',t:'text'},{k:'cat',l:'Kategori',t:'select',o:['Black Series','Kopi','Yakult Series','Non-Coffee','Food','Snack','Other']},{k:'p',l:'Harga jual (Rp)',t:'number'},...ik.map(([k,i])=>({k:'r_'+k,l:'Resep: '+i.n+' ('+i.u+')',t:'number'}))],f,f=>{const p=Number(f.p);if(!f.n.trim())return'Nama menu wajib diisi';if(!Number.isInteger(p)||p<=0)return'Harga harus bilangan bulat > 0';const r={};ik.forEach(([k])=>{const q=Number(f['r_'+k]);if(q>0)r[k]=q});if(!Object.keys(r).length)return'Isi minimal satu bahan resep';const d={n:f.n.trim(),e:f.e||'🍽️',cat:f.cat,p,r};if(m)Object.assign(m,d);else MENU.push({id:Math.max(...MENU.map(x=>x.id))+1,...d});return null})}
function delMenu(id){if(!confirm('Hapus menu '+menu(id).n+'? Riwayat transaksi tetap tersimpan.'))return;menu(id).del=true;delete cart[id];R()}
function menus(){return`<h1>Menu produk</h1><p class="k">Nama dan harga jual sesuai daftar menu kafe. Resep dan harga bahan masih ESTIMASI awal; sesuaikan dengan ✏️ agar HPP akurat.</p><button class="btn" onclick="menuForm()">+ Menu baru</button><div class="card" style="margin-top:12px">${MENU.filter(m=>!m.del).map(m=>{const h=hpp(m),mg=Math.round((m.p-h)/m.p*100);return`<div class="row"><span>${m.e} <b>${m.n}</b><div class="k">${m.cat} · ${fmt(m.p)} · HPP ${fmt(h)} · margin ${mg}%</div></span><span style="white-space:nowrap"><button class="btn sec sm" onclick="menuForm(${m.id})">✏️</button> <button class="btn sec sm" onclick="delMenu(${m.id})">🗑</button></span></div>`}).join('')}</div>`}
function stock(){return`<h1>Stok bahan</h1><button class="btn" onclick="ingForm()">+ Bahan baru</button><div class="card" style="margin-top:12px">${ings().map(([k,i])=>{const[l,c]=st(i);return`<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;gap:8px"><b>${i.n}</b><span class="chip ${c}">${l}</span></div><div class="k">${Math.max(0,i.s).toLocaleString('id-ID')} ${i.u} · min ${i.min.toLocaleString('id-ID')} · Rp${(i.c/1000).toLocaleString('id-ID')}/${i.u}</div><div class="meter"><i style="width:${Math.min(100,Math.max(0,i.s/((i.min*4)||1)*100))}%"></i></div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm" onclick="restock('${k}')">➕ Tambah stok</button><button class="btn sec sm" onclick="ingForm('${k}')">✏️</button><button class="btn sec sm" onclick="delIng('${k}')">🗑</button></div></div>`}).join('')}</div>
<h2 style="margin-top:16px">Riwayat stok masuk dan penyesuaian</h2><div class="card">${moves.slice(0,10).map(m=>`<div class="row"><span>${ING[m.k].n}<div class="k">${m.why} · ${m.at.toLocaleString('id-ID',{timeZone:'Asia/Makassar',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div></span><span style="text-align:right"><b>${m.q>0?'+':''}${m.q.toLocaleString('id-ID')} ${ING[m.k].u}</b>${m.p?`<div class="k">${fmt(m.p)}</div>`:''}</span></div>`).join('')||'<div class="k">Belum ada pergerakan stok</div>'}</div><p class="k">Harga beli memperbarui biaya rata-rata bahan (moving weighted average), sehingga HPP menu ikut berubah.</p>`}
function hist(){const f=hq.toLowerCase(),L=txs.filter(t=>!f||t.no.toLowerCase().includes(f)||t.lines.some(l=>l.n.toLowerCase().includes(f)));return`<h1>Transaksi</h1><input id="hq" placeholder="Cari nomor atau nama produk…" value="${hq}" oninput="hq=this.value;R()"><div class="card" style="margin-top:10px">${L.map(t=>`<div class="row" style="cursor:pointer" onclick="dt='${t.no}';R()"><span><b>${t.no}</b> ${t.demo?'<span class="chip">DEMO</span>':''}<div>${t.lines.map(l=>l.q+'× '+l.n).join(', ')}</div><div class="k">${t.at.toLocaleTimeString('id-ID',{timeZone:'Asia/Makassar',hour:'2-digit',minute:'2-digit'})} · ${t.type} · ${t.method}</div></span><span style="text-align:right"><b>${fmt(t.total)}</b><div><span class="chip ${t.status=='paid'?'ok':'bad'}">${t.status=='paid'?'Paid':'Refunded'}</span></div></span></div>`).join('')||'<div class="k">Tidak ada transaksi</div>'}</div>`}
function detail(){const t=txs.find(x=>x.no===dt);return`<div class="ov"><div class="rc" style="font-family:inherit"><h2>${t.no} ${t.demo?'<span class="chip">DEMO</span>':''}</h2><div class="k">${t.at.toLocaleString('id-ID',{timeZone:'Asia/Makassar'})} · ${t.type} · ${t.method}</div><div style="margin:8px 0">${t.lines.map(l=>`<div class="row"><span>${l.n}<div class="k">${l.q} × ${fmt(l.p)}</div></span><b>${fmt(l.p*l.q)}</b></div>`).join('')}</div><div class="row"><span class="k">Subtotal</span><span>${fmt(t.sub)}</span></div><div class="row"><span class="k">Pajak 10%</span><span>${fmt(t.tax)}</span></div><div class="row"><b>Total</b><b>${fmt(t.total)}</b></div><div class="row"><span class="k">Estimasi HPP</span><span>${fmt(t.hpp)}</span></div><div class="row"><span class="k">Status</span><span class="chip ${t.status=='paid'?'ok':'bad'}">${t.status=='paid'?'Paid':'Refunded'}</span></div><div style="display:flex;gap:8px;margin-top:14px">${t.status=='paid'?`<button class="btn sec" style="flex:1" onclick="refund('${t.no}')">Refund</button>`:''}<button class="btn" style="flex:1" onclick="dt=null;R()">Tutup</button></div></div></div>`}

const cfg={name:'PLACE #1',tag:'YOUNG.WILD.FREE',theme:'red',logo:LOGO,target:500000,w:{cards:true,goal:true,chart:true,top:true,low:true}};
const TH={red:{n:'Merah PLACE',v:{}},black:{n:'Hitam',v:{'--bgx':'#0b0909'}},coffee:{n:'Kopi',v:{'--bgx':'radial-gradient(1000px 500px at 85% -10%,#6b3f27 0,transparent 62%),#3b2417','--bb':'#e0a468','--onb':'#1b110c','--acc':'#e0a468','--sage':'#7a5238'}},light:{n:'Terang',v:{'--bgx':'#fbf1ee','--bg':'#fff','--card':'#fff','--ink':'#2b2220','--mut':'#7a6a66','--line':'#ecd9d4','--cream':'#f8e9e5','--bb':'#c1121f','--sage':'#e7a1a8','--acc':'#c1121f','--h':'#2b2220','--h2':'#6b5a56'}}};
function applyTheme(){const r=document.documentElement.style;Object.values(TH).forEach(t=>Object.keys(t.v).forEach(k=>r.removeProperty(k)));Object.entries(TH[cfg.theme].v).forEach(([k,v])=>r.setProperty(k,v))}
const lg=()=>`<div class="lgbox"><img src="${cfg.logo}" alt="${cfg.name}"></div>`;
const brand=()=>`<div class="brand">${lg()}</div>`,mtop=()=>`<div class="mtop">${lg()}</div>`;
function upLogo(el){const f=el.files[0];if(!f)return;if(f.size>1500000)return say('Ukuran logo maksimal 1,5 MB');const r=new FileReader();r.onload=()=>{cfg.logo=r.result;R()};r.readAsDataURL(f)}
function home(){const td=txs.filter(isToday),paid=td.filter(t=>t.status==='paid'),om=paid.reduce((s,t)=>s+net(t),0),h=paid.reduce((s,t)=>s+t.hpp,0),W=cfg.w;
 const vals=[...PREV,om],mx=Math.max(...vals,1),lbl=vals.map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('id-ID',{timeZone:'Asia/Makassar',weekday:'short'}));
 const cnt={};paid.forEach(t=>t.items.forEach(([id,n])=>cnt[id]=(cnt[id]||0)+n));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3),low=ings().map(([,i])=>i).filter(i=>st(i)[1]!=='ok');
 const c=(k,v)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`,pct=Math.min(100,Math.round(om/cfg.target*100));
 const tgl=new Date().toLocaleDateString('id-ID',{timeZone:'Asia/Makassar',weekday:'long',day:'numeric',month:'long',year:'numeric'});
 return`<div class="hero"><div><div class="hk">${tgl}</div><div class="hn">${cfg.name}</div><div class="hk">${cfg.tag}</div></div><div class="hp"><b>${paid.length}</b><span>transaksi hari ini</span></div></div>
 ${W.cards?`<div class="grid">${c('Omzet hari ini',fmt(om))}${c('Transaksi',paid.length)}${c('Rata-rata',fmt(paid.length?Math.round(om/paid.length):0))}${c('Estimasi HPP',fmt(h))}${c('Laba kotor',fmt(om-h))}</div>`:''}
 ${W.goal?`<div class="card" style="margin-top:12px"><h2>Target omzet harian</h2><div class="row"><b>${fmt(om)}</b><span class="k">dari ${fmt(cfg.target)}</span></div><div class="meter"><i style="width:${pct}%"></i></div><div class="k" style="margin-top:6px">${pct}% tercapai</div></div>`:''}
 <div class="two" style="margin-top:12px;${W.chart?'':'grid-template-columns:1fr'}">${W.chart?`<div class="card"><h2>Omzet 7 hari terakhir</h2><div class="chart">${vals.map((v,i)=>`<div class="bar ${i==6?'t':''}" title="${lbl[i]}: ${fmt(v)}"><i style="height:${Math.round(v/mx*100)}%"></i>${lbl[i]}</div>`).join('')}</div></div>`:''}
 <div style="display:grid;gap:12px;align-content:start">${W.top?`<div class="card"><h2>Menu terlaris</h2>${top.map(([id,n])=>`<div class="row"><span>${menu(id).e} ${menu(id).n}</span><b>${n}</b></div>`).join('')||'<div class="k">Belum ada penjualan</div>'}</div>`:''}
 ${W.low?`<div class="card"><h2>Perlu restock</h2>${low.map(i=>`<div class="row"><span>${i.n}</span><span class="chip ${st(i)[1]}">${st(i)[0]}</span></div>`).join('')||'<div class="k">Semua aman</div>'}</div>`:''}</div></div>
 <p class="k">Laba adalah estimasi operasional, bukan laporan laba rugi akuntansi atau perhitungan pajak final.</p>`}
function pengaturan(){const w=cfg.w,L={cards:'Kartu ringkasan',goal:'Target harian',chart:'Grafik 7 hari',top:'Menu terlaris',low:'Perlu restock'};
 return`<h1>Pengaturan</h1><div class="card"><h2>Identitas kafe</h2><label class="k">Nama kafe</label><input value="${cfg.name}" oninput="cfg.name=this.value"><div style="height:8px"></div><label class="k">Tagline</label><input value="${cfg.tag}" oninput="cfg.tag=this.value"><div style="height:10px"></div><label class="k">Logo</label><div class="lgbox" style="margin:6px 0"><img src="${cfg.logo}" style="max-height:130px;width:auto" alt="logo"></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="file" accept="image/*" onchange="upLogo(this)" style="flex:1;min-width:0"><button class="btn sec sm" onclick="cfg.logo=LOGO;R()">Logo asli</button></div></div>
 <div class="card" style="margin-top:12px"><h2>Tema warna</h2><div class="pills">${Object.entries(TH).map(([k,t])=>`<button class="pill ${cfg.theme==k?'on':''}" onclick="cfg.theme='${k}';R()">${t.n}</button>`).join('')}</div></div>
 <div class="card" style="margin-top:12px"><h2>Tampilan dashboard</h2>${Object.entries(L).map(([k,l])=>`<div class="row"><span>${l}</span><button class="pill ${w[k]?'on':''}" onclick="cfg.w.${k}=!cfg.w.${k};R()">${w[k]?'Tampil':'Sembunyi'}</button></div>`).join('')}<div class="row"><span>Target omzet harian (Rp)</span><input style="width:140px" inputmode="numeric" value="${cfg.target}" oninput="cfg.target=Math.max(1,Number(this.value.replace(/\\D/g,''))||1)"></div></div>
 <p class="k">Pengaturan ini tersimpan di memori browser selama pratinjau. Di versi sungguhan akan disimpan di database (tabel settings).</p>`}
const NAV=[['home','🏠','Dashboard'],['pos','🧾','Kasir'],['hist','📋','Transaksi'],['stock','📦','Stok'],['menus','🍽️','Menu'],['pengaturan','⚙️','Atur']];
function R(keep){applyTheme();const f=document.activeElement&&document.activeElement.id,pos_=document.activeElement&&document.activeElement.selectionStart;
 const nav=NAV.map(([k,i,l])=>`<button class="nb ${tab==k?'on':''}" onclick="tab='${k}';R();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join('');
 document.getElementById('app').innerHTML=`<div class="shell"><aside class="side">${brand()}${nav}</aside><main>${mtop()}<div class="banner"><b>Pratinjau antarmuka.</b> Data DEMO tersimpan di memori browser dan belum tersambung ke database. Muat ulang halaman akan mengatur ulang data.</div>${{home,pos,hist,stock,menus,pengaturan}[tab]()}</main><nav class="bn">${nav}</nav></div>${rc?receipt():''}${dt?detail():''}${fm?formView():''}${toast?`<div class="toast">${toast}</div>`:''}`;
 if(f){const e=document.getElementById(f);if(e){e.focus();try{e.setSelectionRange(pos_,pos_)}catch(_){}}}}
R();
</script></body></html>
